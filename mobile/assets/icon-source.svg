<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="120" y1="40" x2="900" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.45" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="teal" x1="420" y1="620" x2="760" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D2B4"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed square: iOS applies its own mask. Do not pre-round. -->
  <rect width="1024" height="1024" fill="url(#background)"/>
  <circle cx="512" cy="512" r="360" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="18"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="url(#teal)" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round" stroke-dasharray="420 1400" stroke-dashoffset="-40"/>
  <!-- Wordmark P -->
  <rect x="360" y="280" width="92" height="460" rx="46" fill="#FFFFFF"/>
  <path d="M406 280 H560 C642 280 708 346 708 428 C708 510 642 576 560 576 H406" fill="none" stroke="#FFFFFF" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Teal check + arc accent -->
  <path d="M470 560 L580 670 L740 390" fill="none" stroke="url(#teal)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="740" cy="390" r="28" fill="#FFFFFF"/>
  <path d="M500 720 C580 780, 700 740, 780 620" fill="none" stroke="url(#teal)" stroke-width="28" stroke-linecap="round" stroke-opacity="0.85"/>
</svg>
